# CI + deploy to Cloudflare Workers (static assets + /api Worker).
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Workers Scripts:Edit" (+ "D1:Edit" if you bind a database)
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
# See docs/DEPLOY.md.
name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build (and deploy on main)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Devtools stripped from production bundle
        run: npm run check:devstrip -- --skip-build

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run

      - name: Deploy to Cloudflare
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
